spring.application.name=springAIHelloWorld
spring.ai.openai.api-key=${NVIDIA_NGC_API_KEY}
spring.ai.openai.base-url=https://integrate.api.nvidia.com/v1
spring.ai.openai.chat.model=nvidia/nemotron-3-ultra-550b-a55b
spring.ai.openai.chat.temperature=0.7
spring.ai.bedrock.aws.access-key=${AWS_ACCESS_KEY}
spring.ai.bedrock.aws.region=us-west-2
spring.ai.bedrock.aws.secret-key=${AWS_SECRET_KEY}
spring.ai.bedrock.converse.chat.model=arn:aws:bedrock1:us-west-2:555681241997:inference-profile/global.anthropic.claude-sonnet-4-6
spring.ai.chat.client.enabled=false